services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - path: api/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_PATH: /data/sheshield.sqlite
    volumes:
      - ./api/data:/data
    restart: unless-stopped
